<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log - I forgot my password</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="shortcut icon" href="favicons/favicon-32x32.png" type="image/x-icon">
</head>
<body>
    <header class="nbu">
        <button class="nButton" id="back">
            <img src="https://img.icons8.com/?size=100&id=99996&format=png&color=FFFFFF" alt="">
        </button>
    </header>
    <div id="forgottonb"></div>
    <section class="newPassword">

        <div class="breakLines">
            <h1>Enter your new <strong class="GreenCard">password</strong><strong class="pointer">|</strong></h1>
            <p><strong class="consoleWrite">&lt;/</strong>For security reasons, please re-enter your information with the new password in the field provided. <br> Make sure it is easy to remember and secure.<strong class="consoleWrite">/></strong></p>
            </div>
            <form action="/update-password" method="post" id="former">
                <input type="text" name="name" id="name" placeholder="Name:" required>
                    <input type="email" name="email" id="email" placeholder="Email:" required>
                <div class="eye">
                            <input type="password" name="newpassword" id="newpassword" placeholder="New Password:" required class="newEmail">
                            <div class="eyeimg">
                                <img src="https://img.icons8.com/?size=100&id=MiB2bvr7uGVu&format=png&color=FFFFFF" alt="" id="eyeOn">
                                <img src="https://img.icons8.com/?size=100&id=4y6r43dyjbzw&format=png&color=FFFFFF" alt="" id="eyeOff">
                            </div>
                        </div>
                         <button type="submit" class="SubmitButton">Continue</button>
            </form>
        
    </section>
</body>
<script>
    document.querySelector('#back').addEventListener('click', () => {
            window.history.back();
        });
        const eye = document.querySelector(".eye")
    const onEye = document.querySelector('#eyeOn');
        const offEye = document.querySelector('#eyeOff');
        const password = document.querySelector('#newpassword');
        eye.style.opacity = '1'
        onEye.addEventListener('click', () => {
            offEye.style.display = 'flex'
            onEye.style.opacity = '0';
            setTimeout(() => {
                offEye.style.opacity = '1';
            }, 150)
            password.type = 'text';
        });

        offEye.addEventListener('click', () => {
            offEye.style.opacity = '0';
            onEye.style.opacity = '1';
            setTimeout(() => {
                offEye.style.display = 'none'
            }, 750)
            password.type = 'password';
        });
</script>
</html>
