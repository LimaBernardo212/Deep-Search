<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Loja</title>
</head>

<body>
    <h1>Cadastro da Loja</h1>
    <form id="storeForm" enctype="multipart/form-data">
  <!-- Campos de texto -->
  <input type="text" name="storeName" id="storeName" placeholder="Store name (e.g., Console Barber Shop)" required>
<input type="text" name="address" id="address" placeholder="Full address (e.g., 123 Main St, City, State)" required>
<input type="text" name="cnpj" id="cnpj" placeholder="CNPJ (e.g., 00.000.000/0000-00)" required>
<input type="text" name="phone" id="phone" placeholder="Phone number (e.g., +55 31 99999-9999)" required>
<input type="email" name="storeEmail" id="storeEmail" placeholder="Store email (e.g., contact@store.com)" required>
<textarea name="description" id="description" placeholder="Brief description of your store and services offered..."></textarea>
<input type="text" name="openHours" id="openHours" placeholder="Opening time (e.g., 08:00)">
<input type="text" name="closedHours" id="closedHours" placeholder="Closing time (e.g., 18:00)">
<input type="text" name="closedDays" id="closedDays" placeholder="Closed days (e.g., Sunday, Monday)">
<input type="text" name="functionary1" id="functionarys" placeholder="Employee 1 name (optional)">
<input type="text" name="functionary2" id="functionarys" placeholder="Employee 2 name (optional)">
<input type="text" name="functionary3" id="functionarys" placeholder="Employee 3 name (optional)">
  <!-- Input de arquivo - NOME DEVE SER "storeImage" -->
  <input type="file" name="storeImage" id="storeImage" accept="image/*">
  
  <button type="submit">Cadastrar Loja</button>
</form>
</body>
<script>
    const form = document.getElementById('storeForm');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  
  // ✅ CRIAR FormData do form completo
  const formData = new FormData(form);
  
  // ⚠️ IMPORTANTE: Verificar se o arquivo foi selecionado
  const fileInput = document.getElementById('storeImage');
  if (fileInput.files.length === 0) {
    console.warn('⚠️ Nenhuma imagem selecionada');
    // Você pode prosseguir ou avisar o usuário
  } else {
    console.log('✅ Arquivo selecionado:', fileInput.files[0].name);
  }
  
  try {
    const response = await fetch('/CadNewStore', {
      method: 'POST',
      body: formData,
      // ❌ NÃO adicionar Content-Type - o navegador faz automaticamente
      // ❌ NÃO usar headers: { 'Content-Type': 'multipart/form-data' }
    });
    
    const data = await response.json();
    
    if (response.ok) {
      console.log('✅ Loja cadastrada:', data);
      alert('Loja cadastrada com sucesso!');
      
      // Agora criar a página da loja
      await criarPaginaLoja(data.storeName);
    } else {
      console.error('❌ Erro:', data);
      alert(data.error || 'Erro ao cadastrar loja');
    }
  } catch (error) {
    console.error('❌ Erro na requisição:', error);
    alert('Erro ao cadastrar loja');
  }
});

</script>
</html>
