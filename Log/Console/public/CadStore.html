<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Loja</title>
</head>
<body>
    <h1>Cadastro da Loja</h1>
    <form action="/CadNewStore" method="post">
        <input type="text" name="storeName" placeholder="Nome da Loja" required><br>
        <input type="text" name="address" placeholder="Endereço" required><br>
        <input type="number" name="cnpj" id="cnpj" placeholder="CNPJ" required><br>
        <input type="tel" name="phone" placeholder="Telefone" required><br>
        <input type="email" name="storeEmail" id="storeEmail" placeholder="Email da Loja" required><br>
        <input type="submit" value="Cadastrar">
    </form>
</body>
</html>
