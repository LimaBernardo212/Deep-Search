<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello! You'be welcome</title>
    <style>
        body{
            background-image: linear-gradient(to bottom, #0d0d0d,#042326);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            color: #F2F2F2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .uni{
            width: 40vw;
            height: 20vh;
            padding: 10px 30px;
            border: 1px solid #a6a6a64d;
            border-radius: 20px;
           
        }
        .uni h1{
            margin-top: 2vw;
        }
        strong{
            color: #238c6e;
        }
        .dob{
            width: 20vw;
            height: 7vh;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #a6a6a64d;
            border-radius: 20px;
            font-size: 0.9em;
            margin-top: 2vh;
        }
        .trip{
            width: 18vw;
            height: 25vh;
            border: 1px solid #a6a6a64d;
            border-radius: 20px;
            margin-left: 3vw;
            margin-top: 2vh;
           padding: 20px;
            
        }
        .bb{
            display: flex;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <div>
        <div class="uni">
            <h1>Hello, <strong>${functionaryName}</strong></h1>
            <p>The appointment for ${name} has been paid.</p>
            
        </div>
        <div class="bb">
            <div class="dob">
                <h2>Your client is ${name}</h2>
            </div>
            <div class="trip">
                <p style="margin-top: 2vw;">Day: <strong>${day}</strong></p>
                <p>Hour:<strong> ${hour}</strong></p>
                <p>Price: <strong>${totalPrice}</strong></p>
                <p>Previously paid: <strong>${payed}</strong></p>
            </div>
        </div>
       
    </div>
</body>
</html>
