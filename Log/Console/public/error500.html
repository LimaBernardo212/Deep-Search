<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log - Error : Status : 500</title>
    <link rel="shortcut icon" href="favicons/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="style/style.css">
    <style>
        body{
            overflow: hidden;
        }
        .imgSect{
            opacity: 0;
        }
    </style>
</head>
<body>
    <header class="nb">
        <button class="nButton" id="back">
            <img src="https://img.icons8.com/?size=100&id=99996&format=png&color=FFFFFF" alt="">
        </button>
    </header>
    <div id="nbtoforgot"></div>
    <section class="error">
        <div class="text">
            <h1>Error Status <strong class="GreenCard">500</strong><strong class="pointer">!</strong></h1>
            <p><strong class="consoleWrite">>_</strong>Unfortunately, there was a server error and we were unable to complete the action. Please wait a minute and try again. We apologize for the inconvenience. Thank you for your understanding.</p>
        </div>
        <div class="imgSect">
            <img src="img/TapaBuraco.png" alt="">
        </div>
    </section>
</body>
<script>
    document.querySelector('#back').addEventListener('click', () => {
            window.history.back();
        });
    const text = document.querySelector('.text');
    const img = document.querySelector('.imgSect')
    const obs = new IntersectionObserver((el) => {
        el.forEach(e => {
            if (e.isIntersecting){
                e.target.classList.add('UpperActiveText')
                setTimeout(() => {
                    img.classList.add('UpperActiveImg')
                }, 1000);
            }
        });
    })
    obs.observe(text)
</script>
</html>
