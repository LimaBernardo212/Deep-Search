        <nav class="links-content" aria-label="Primary">

        <div class="loginButton-content">

    </header>

    <main class="fourSections-content">
        <section class="Hero-Section">
            <div class="infos-container">

                    <h1> <strong class="consoleWrite">>_</strong> Log: A plataform for manage <strong id="dinamicState"></strong></h1>

    <footer class="desapearRandom">
    </footer>
</body>
<script>
    const dinamicState = document.getElementById('dinamicState');
    const states = ['Schedules.', 'Projects.', 'Treatments.'];
    let index = 0;
    
   

    function changeState() {
        dinamicState.style.opacity = 0;
        setTimeout(() => {
            dinamicState.style.opacity = 1;
            dinamicState.innerHTML = states[index];
            index = (index + 1) % states.length;
        }, 450);
       
    }
    
    setInterval(changeState, 3567);
   
    changeState();
    
</script>
