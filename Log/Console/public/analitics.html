<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log: Analytics</title>
    <link rel="stylesheet" href="/style/style.css" />
    <link
      rel="shortcut icon"
      href="/favicons/favicon-32x32.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <header class="homenav">
      <div class="consoleImg">
        <img src="/img/().png" alt="" />
      </div>

      <div class="account">
        <div class="person" id="people">
          <img
            src="https://img.icons8.com/?size=100&id=85147&format=png&color=FFFFFF"
            alt=""
          />
        </div>
        <div class="settings" id="sett">
          <img
            src="https://img.icons8.com/?size=100&id=83214&format=png&color=FFFFFF"
            alt=""
          />
        </div>
      </div>
    </header>

    <section class="userPOV">
      <aside class="leftBar">
        <div class="divAndYourLabel">
          <div id="store" class="itens" title="store">
            <img
              src="https://img.icons8.com/?size=100&id=92137&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Home</p>
        </div>
        <div class="divAndYourLabel">
          <div id="analitics" class="itenSelected itens" title="Your Schedules">
            <img
              src="https://img.icons8.com/?size=100&id=98067&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Analytics</p>
        </div>
        <div class="divAndYourLabel">
          <div id="clientArea" class="itens" title="Your Treatments">
            <img
              src="https://img.icons8.com/?size=100&id=88302&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Schedule</p>
        </div>
        <div class="divAndYourLabel">
          <div id="plansinapp" class="itens" title="Yours Plans in Stores">
            <img
              src="https://img.icons8.com/?size=100&id=86440&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Plans</p>
        </div>
        <div class="divAndYourLabel">
          <div id="services" class="itens" title="Your Project">
            <img
              src="https://img.icons8.com/?size=100&id=92680&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Management</p>
        </div>
        <div class="divAndYourLabel">
          <div id="services" class="itens" title="Your Project">
            <img
              src="https://img.icons8.com/?size=100&id=86131&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Bank</p>
        </div>
        <div class="divAndYourLabel">
          <div id="documents" class="itens" title="Documents">
            <img
              src="https://img.icons8.com/?size=100&id=120449&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Terminal</p>
        </div>
      </aside>

      <main class="infoContent">
        <div id="loading"></div>

        <div class="content">
          <div class="store-content"></div>
        </div>
      </main>
    </section>
  </body>
  <script>
    function render(el) {
        const element = document.createElement("div");
        element.classList.add("scheduleData");
        element.innerHTML = el;
        return element;
      }
    window.addEventListener("load", async () => {
      const load = document.querySelector("#loading");
      const content = document.querySelector(".content");
      const container = document.querySelector(".store-content")
      const plans = document.querySelector("#plansinapp");
      const client = document.querySelector("#clientArea");
      client.addEventListener("click", () => {
        window.location.href = "/client/schedules"
      })
      plans.addEventListener("click", () => {
        window.location.href = "/store-plans";
      });
      const home = document.querySelector("#store");
      home.addEventListener("click", () => {
        window.location.href = "/stores/home";
      });
      const ini = await fetch("/analitics",  {
        method: "GET",
        headers: {"Content-Type": "application/json"}
      })
      if (ini.ok){
        const data = await ini.json()
        console.log(data)
        const structure = data.structure
        load.style.opacity = '0'
        
            content.style.display = 'flex'
            setTimeout(() => {
                content.style.opacity = '1'
                container.appendChild(render(structure))
            }, 500);
            
        
        
      }
    });
  </script>
</html>
