<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log: Plans</title>
    <link rel="stylesheet" href="/style/style.css" />
    <link
      rel="shortcut icon"
      href="/favicons/favicon-32x32.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <header class="homenav">
      <div class="consoleImge">
        <img
          src="https://img.icons8.com/?size=100&id=85099&format=png&color=FFFFFF"
          alt=""
          id="bbk"
        />
      </div>
      <div class="accounter">
        <div class="back" id="back">
          <img src="/img/().png" alt="" />
        </div>
      </div>
    </header>

    <section class="userPOV">
      <aside class="leftBar">
        <div class="divAndYourLabel">
          <div id="store" class="itens" title="store">
            <img
              src="https://img.icons8.com/?size=100&id=92137&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Home</p>
        </div>
        <div class="divAndYourLabel">
          <div id="analitics" class="itens" title="Your Schedules">
            <img
              src="https://img.icons8.com/?size=100&id=98067&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Analytics</p>
        </div>
        <div class="divAndYourLabel">
          <div id="clientArea" class="itens" title="Your Treatments">
            <img
              src="https://img.icons8.com/?size=100&id=88302&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Client</p>
        </div>
        <div class="divAndYourLabel">
          <div
            id="plansinapp"
            class="itenSelected itens"
            title="Yours Plans in Stores"
          >
            <img
              src="https://img.icons8.com/?size=100&id=86440&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Plans</p>
        </div>
        <div class="divAndYourLabel">
          <div id="services" class="itens" title="Your Project">
            <img
              src="https://img.icons8.com/?size=100&id=92680&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Management</p>
        </div>
        <div class="divAndYourLabel">
          <div id="documents" class="itens" title="Documents">
            <img
              src="https://img.icons8.com/?size=100&id=120449&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Terminal</p>
        </div>
      </aside>

      <main class="infoContent">
        <!-- <div id="loading"></div> -->

        <div class="content" style="opacity: 1">
          <form action="/plans/register/bank" method="post">
            <input
              type="text"
              name="holder_name"
              id="holder_name"
              placeholder="Holder Name: "
            />
            <input
              type="text"
              name="holder_type"
              id="holder_type"
              placeholder="holder_type"
            />
            <input
              type="text"
              name="bank_code"
              id="bank_code"
              placeholder="bank_code"
            />
            <input
              type="text"
              name="branch_code"
              id="branch_code"
              placeholder="branch_code"
            />
            <input
              type="text"
              name="account_number"
              id="account_number"
              placeholder="account_number"
            />
            <input type="text" name="tax_id" id="tax-id" placeholder="tax_id" />
            <button type="submit">Send</button>
          </form>
          <form action="/plans/register/plans" method="post" id="contentForm">
            <input
              type="text"
              name="name_product"
              id="name_product"
              placeholder="name_product"
            />
            <input
              type="number"
              name="price_product"
              id="price_product"
              placeholder="price_product"
            />
            <textarea
              name="description"
              id="description"
              placeholder="description"
            ></textarea>
            
            <button type="submit">Send</button>
          </form>
          <div id="adder"><img src="https://img.icons8.com/?size=100&id=95779&format=png&color=FFFFFF" alt=""></div>
        </div>
      </main>
    </section>
  </body>
  <script>
    function createPlan() {
      const service = document.createElement("div");
      service.classList.add("PlanerDiv");
      service.innerHTML = `<input type="text" name="name_product" id="name_product" placeholder="name_product">
                <input type="number" name="price_product" id="price_product" placeholder="price_product">
                <textarea name="description" id="description" placeholder="description"></textarea>`;
      return service;
    }
    const adder = document.querySelector("#adder");
    const container = document.querySelector("#contentForm")
    adder.addEventListener("click", () => {
      container.appendChild(createPlan())
    })
  </script>
</html>
