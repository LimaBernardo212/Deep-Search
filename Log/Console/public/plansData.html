          <form action="/plans/register/plans" method="post" id="contenterForm">
            <section id="contenterFormer">
              <div id="contentForm">
                <div class="unionE">
                  <input
                    type="text"
                    name="name_product"
                    id="name_product"
                    placeholder="Plan Name"
                  />
                  <input
                    type="text"
                    name="price_product"
                    id="price_product"
                    placeholder="Plan Product"
                  />
                </div>
                <textarea
                  name="description"
                  id="description"
                  placeholder="Description(MAX 300 CARACTERS...)"
                  maxlength="300"
                  style="margin-left: 0;"
                ></textarea>
              
              </div>
              
            </section>
            <div id="adder"><img src="https://img.icons8.com/?size=100&id=95779&format=png&color=FFFFFF" alt=""></div>
             
          </form>
          <div class="selectedIndicator" style="opacity: 1;"><button type="submit">Create <strong class="consoleWrite">>></strong></button> </div>
         
        
    </section>
  </body>
  <script>
    function createPlan() {
      const service = document.createElement("div");
      service.classList.add("PlanerDiv");
      service.innerHTML = `<div id="contentForm">
              <div class="unionE">
                <input
                  type="text"
                  name="name_product"
                  id="name_product"
                  placeholder="Plan Name"
                />
                <input
                  type="text"
                  name="price_product"
                  id="price_product"
                  placeholder="Plan Product"
                />
              </div>
              <textarea
                name="description"
                id="description"
                placeholder="Description"
                style="margin-left: 0;"
              ></textarea>
              
            </div>`;
      return service;
    }
    document.querySelector('#back').addEventListener('click', () => {
            window.history.back();
        });
    const adder = document.querySelector("#adder");
    const container = document.querySelector("#contenterFormer")
    const selectedIndicatorBtn = document.querySelector(".selectedIndicator")
    const form = document.querySelector("#contenterForm")
    adder.addEventListener("click", () => {
      container.appendChild(createPlan())
    })
    selectedIndicatorBtn.addEventListener("click", () => {
      form.submit()
    })
  </script>
