<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log: Plan Update</title>
    <link rel="stylesheet" href="/style/style.css" />
    <link
      rel="shortcut icon"
      href="/favicons/favicon-32x32.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <header class="nbu">
      <button class="nButton" id="back">
        <img
          src="https://img.icons8.com/?size=100&id=99996&format=png&color=FFFFFF"
          alt=""
        />
      </button>
    </header>
    
    <main class="services-container">
        <div id="loading"></div>
      <section class="renderization">
          <div class="services-tesxt">
            <h1 id="ob">
              <strong class="consoleWrite">@</strong>Update
              <span class="GreenCard">Plans</span>
            </h1>
            <p>
              Manage and configure your subscription plans<strong class="pointer"
                >.</strong
              >
            </p>
          </div>
          <form action="/plan/updater" method="post" style="margin-top: 2vh;">
            
            <section id="contenterFormer" style="min-height: 60vh;">
            </section>
            <div class="centralNB">
                <div id="adder">
                  <img
                    src="https://img.icons8.com/?size=100&id=95779&format=png&color=FFFFFF"
                    alt=""
                  />
                </div>
                <div id="remover">
                  <img
                    src="https://img.icons8.com/?size=100&id=85496&format=png&color=FFFFFF"
                    alt=""
                  />
                </div>
            </div>
          
          </form>
          <div class="selectedIndicator" style="opacity: 1; top: 88vh; position: sticky;"><button type="submit">Edit <strong class="consoleWrite">>></strong></button> </div>
      </section>
      
    </main>
    
  </body>
  <script>
    function createHour() {
      const row = document.createElement("div");
      row.classList.add("hour-row");
      row.innerHTML = `<div id="contentForm">
              <div class="unionE">
                <input
                  type="text"
                  name="name_product"
                  id="name_product"
                  placeholder="Plan Name"
                />
                <input
                  type="text"
                  name="price_product"
                  id="price_product"
                  placeholder="Plan Product"
                />
              </div>
              <textarea
                name="description"
                id="description"
                placeholder="Description"
                style="margin-left: 0;"
              ></textarea>
              
            </div>`;
      return row;
    }
    function render(el) {
      const element = document.createElement("div");
      element.innerHTML = el;
      return element.children;
    }
    function removeHour(el) {
      const rows = el.querySelectorAll(".hour-row");
      if (rows.length > 0) {
        el.removeChild(rows[rows.length - 1]); // remove o último .hour-row
      }
    }

    window.addEventListener("load", async () => {
      const ini = await fetch("/updater/plans", {
        method: "GET",
        headers: { "Content-Type": "application/json" },
      });
      if (ini.ok) {
        const renderization = document.querySelector(".renderization");
        const adder = document.querySelector("#adder");
        const container = document.querySelector("#contenterFormer");
        const selectedIndicatorBtn =
          document.querySelector(".selectedIndicator");
        const data = await ini.json();
        const loading = document.querySelector("#loading");
        loading.style.opacity = "0";
        container.style.opacity = "1";
        renderization.style.opacity = '1'
        const html = data.html;
        const rendered = render(html);
        const childrenArray = Array.from(rendered);
        for (let child of childrenArray) {
          container.appendChild(child);
        }
        const add = document.querySelector("#adder");
        const sub = document.querySelector("#remover");
        add.addEventListener("click", () => {
          container.appendChild(createHour());
        });
        
        sub.addEventListener("click", () => {
            const rows = document.querySelectorAll(".hour-row");
            if (rows.length > 1){
                removeHour(container);  
            }
        });
        const form = document.querySelector("form")
        selectedIndicatorBtn.addEventListener("click", () => {
            form.submit()
        })  
      }
      
      document.querySelector("#back").addEventListener("click", () => {
        window.history.back();
      });
      
    });
  </script>
</html>
