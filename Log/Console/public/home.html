        <div class="divAndYourLabel moreIten">

      </aside>
      <main class="infoContent">
        <div id="loading"></div>
        <div class="content">
          <div class="searcher">
            <form action="" method="POST" id="searchForm">
              <input
                type="text"
                name="search"
                id="search"
                placeholder="Search using name or PIN:"
              />
              <input type="submit" style="display: none;">
                
              </button>
            </form>
          </div>
          <div class="store-content"></div>
        </div>
      </main>
    </section>
  </body>
  <script>
    const content = document.querySelector(".content");
    const loading = document.querySelector("#loading");
    const storecontent = document.querySelector(".store-content");
    
    const schedule = document.querySelector("#schedule")
    const more = document.querySelector(".moreIten");
    const contenter = document.querySelector(".more-content");
    const plans = document.querySelector("#plansinapp")
    plans.addEventListener("click", () => {
      window.location.href = `/my/plan`
    })
    const projects = document.querySelector("#documents");
    projects.addEventListener('click', () => {
        window.location.href = '/stores/home'
      })
    more.addEventListener("click", () => {
      console.log(more); // Deve mostrar o elemento
console.log(contenter);
      window.location.href = "/more"
    })
    schedule.addEventListener('click', () => {
      console.log('Sensacional d+ serio muito top')
      window.location.href = '/schedule/home';
    })
    function createStores(el) {
      const element = document.createElement("div");
      element.classList.add("storeRow");
      element.innerHTML = el;
      return element;
    }
    window.addEventListener("load", async () => {
      const req = await fetch("/return/data", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify({
          also: "Also",
        }),
      });
      if (req.ok) {
        const data = await req.json();
        const objects = data.return;
        const storeNames = data.storeName;
        loading.style.opacity = 0;
        
        setTimeout(() => {
          loading.style.display = "none";
          content.style.display = "flex";
          setTimeout(() => {
            content.style.opacity = 1;
          }, 250);
          objects.forEach((el, i) => {
            storecontent.appendChild(createStores(el));
          });
          
          const stored = document.querySelectorAll(".store");
        stored.forEach((el, i) => {
            el.addEventListener("click", async () => {
                try {
                    const request = await fetch('/store/page', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        storeName: storeNames[i]
                    })
                });
                if (request.ok){
                    const response = await request.json();
                    console.log('Success:', response);
                    const redirect = response.redirect;
                    window.location.href = redirect;
                } else {
                    console.log('Algo deu errado', request.status);
                }
                } catch (error) {
                   console.log('Error:', error); 
                }
            });
        })
        const fav = document.querySelectorAll("#moreinfos button")
        
        fav.forEach((el, i) => {
          let favClicked = el.getAttribute("data-fav")
          el.addEventListener("click", async (e) => {
            e.stopPropagation()
            if (favClicked == 'false'){
              const starOn = el.querySelector("#starOn")
              starOn.style.opacity = '1'
              console.log("fav clicked")
              favClicked = true
              const fav = await fetch("/fav-store", {
                method: "POST",
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                  storeName: storeNames[i]
                })
              })
              if (fav.ok){
                window.location.reload()
              }
            }
            if (favClicked == 'true'){
              const starOn = el.querySelector("#starOn")
              starOn.style.opacity = '0'
              console.log("fav clicked")
              favClicked = false
              const fav = await fetch("/unfav-store", {
                method: "POST",
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                  storeName: storeNames[i]
                })
              })
              if (fav.ok){
                window.location.reload()
              }
            }
          })
        })
        }, 750);
        
      } else {
        console.log("Algo deu errado", req.status);
      }
      
    });
  </script>
</html>
