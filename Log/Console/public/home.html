<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log: Home</title>
    <link rel="shortcut icon" href="favicons/favicon-32x32.png" type="image/x-icon">
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <header class="homenav">
        <div class="consoleImg">
            <img src="img/().png" alt="">
        </div>
        <div class="quick-comands">
            <div class="navComands" id="add">
                <div class="Comands" id="AddComands">
                    <button id="addBtn" class="comanders">
                        <img src="https://img.icons8.com/?size=100&id=98393&format=png&color=FFFFFF" alt="">
                    </button>
                    <div class="links" id="AddLinks">
                        <a href="" class="add-link">
                            Add new store
                        </a>
                        <a href="" class="add-link">
                            New Registration API
                        </a>
                        <a href="" class="add-link">
                            Add schedule
                        </a>
                    </div>
                </div>
            </div>
            <div class="navComands" id="edit">
                <div class="Comands" id="EditComands">
                    <button id="editBtn" class="comanders">
                        <img src="https://img.icons8.com/?size=100&id=85955&format=png&color=FFFFFF" alt="">
                    </button>
                </div>
                <div class="links" id="EditLinks">
                    <a href="" class="add-link">Edit Store Details</a>
                    <a href="" class="add-link">Edit API Key</a>
                    <a href="" class="add-link">Edit a schedule</a>
                    <a href="" class="add-link">Edit the delivery time of a project or treatment.</a>
            
                </div>
            </div>
            <div class="navComands" id="delete">
                <div class="Comands" id="DeleteComands">
                    <button class="comanders" id="deleteBtn">
                        <img src="https://img.icons8.com/?size=100&id=102384&format=png&color=FFFFFF" alt="">
                    </button>
                </div>
                <div class="links" id="DeleteLinks">
                    <a href="" class="add-link">Delete Store</a>
                    <a href="" class="add-link">Delete API</a>
                    <a href="" class="add-link">Delete schedules</a>
                </div>
            </div>
        </div>
        <div class="search">
            <form action="" method="post">
                <input type="text" name="searcher" id="searcher" placeholder="Search by name or PIN:">
                <button type="submit">
                    <img src="https://img.icons8.com/?size=100&id=83218&format=png&color=FFFFFF" alt="">
                </button>
            </form>
        </div>
        <div class="account">
            <div class="person" id="people">
                <img src="https://img.icons8.com/?size=100&id=85147&format=png&color=FFFFFF" alt="">
            </div>
            <div class="settings" id="sett">
                <img src="https://img.icons8.com/?size=100&id=83214&format=png&color=FFFFFF" alt="">
            </div>
        </div>
    </header>
    <aside class="leftBar">
        <div id="home" class="itens" title="Home">
            <img src="https://img.icons8.com/?size=100&id=86527&format=png&color=FFFFFF" alt="">
        </div>
        <div id="schedule" class="itens" title="Your Schedules">
            <img src="https://img.icons8.com/?size=100&id=116296&format=png&color=FFFFFF" alt="">
        </div>
        <div id="treatments" class="itens" title="Your Treatments">
            <img src="https://img.icons8.com/?size=100&id=86312&format=png&color=FFFFFF" alt="">
        </div>
        <div id="plansinapp" class="itens" title="Yours Plans in Stores"><img src="https://img.icons8.com/?size=100&id=86440&format=png&color=FFFFFF" alt=""></div>
        <div id="projects" class="itens" title="Your Project"><img src="https://img.icons8.com/?size=100&id=85615&format=png&color=FFFFFF" alt=""></div>
        <div id="API" class="itens" title="API">
            <img src="https://img.icons8.com/?size=100&id=85950&format=png&color=FFFFFF" alt="">
        </div>
    </aside>
    
</body>
</html>
