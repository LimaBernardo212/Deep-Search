<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log: Stores</title>
    <link rel="stylesheet" href="/style/style.css" />
    <link
      rel="shortcut icon"
      href="/favicons/favicon-32x32.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <header class="homenav">
      <div class="consoleImge">
        <img
          src="https://img.icons8.com/?size=100&id=85099&format=png&color=FFFFFF"
          alt=""
          id="bbk"
        />
      </div>
      <div class="accounter">
        <div class="back" id="back">
          <img src="/img/().png" alt="" />
        </div>
      </div>
    </header>
    
    <section class="userPOV">
      <aside class="leftBar">
        <div class="divAndYourLabel">
          <div id="store" class="itenSelected itens" title="store">
            <img
              src="https://img.icons8.com/?size=100&id=92137&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Home</p>
        </div>
        <div class="divAndYourLabel">
          <div id="analitics" class="itens" title="Your Schedules">
            <img
              src="https://img.icons8.com/?size=100&id=98067&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Analytics</p>
        </div>
        <div class="divAndYourLabel">
          <div id="clientArea" class="itens" title="Your Treatments">
            <img
              src="https://img.icons8.com/?size=100&id=88302&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Client</p>
        </div>
        <div class="divAndYourLabel">
          <div id="plansinapp" class="itens" title="Yours Plans in Stores">
            <img
              src="https://img.icons8.com/?size=100&id=86440&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Plans</p>
        </div>
        <div class="divAndYourLabel">
          <div id="services" class="itens" title="Your Project">
            <img
              src="https://img.icons8.com/?size=100&id=92680&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Management</p>
        </div>
        <div class="divAndYourLabel">
          <div id="documents" class="itens" title="Documents">
            <img
              src="https://img.icons8.com/?size=100&id=120449&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Terminal</p>
        </div>
      </aside>
      
      <main class="infoContent">
        <div id="loading"></div>

        <div class="content">
          <div class="your-store-data"></div>
        </div>
      </main>
    </section>

  </body>
  <script>
    window.addEventListener("load", async () => {
        function render(el) {
      const element = document.createElement("div");
      element.classList.add("scheduleData");
      element.innerHTML = el;
      return element;
    }
      const bbk = document.querySelector("#bbk");
      const load = document.querySelector("#loading")
      const content = document.querySelector('.content')
      const storeData = document.querySelector('.your-store-data');
      bbk.addEventListener("click", () => {
        window.location.href = "/home.html";
      });
      const req = await fetch("/verify/have/stores", {
        method: "GET",
        headers:{
            "Content-Type": "application/json"
        }
      })
      if (req.ok){
        const data = await req.json()
        storeData.appendChild(render(data.returner))
        load.style.opacity = '0';
        content.style.opacity = '1'
        const central_plus = document.querySelector(".central-plus");
        central_plus.addEventListener("click", () => {
          window.location.href = '/cad/store'
        })
        
      }
    })
  </script>
</html>
