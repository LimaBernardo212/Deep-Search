<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <header class="homenav">

      </div>

      <div class="account">
        <div class="person" id="people">

          />

        <div class="settings" id="sett">

            src="https://img.icons8.com/?size=100&id=83214&format=png&color=FFFFFF"
            alt=""
          />
        </div>
      </div>
    </header>
    <section class="userPOV">
      <aside class="leftBar">
        <div class="divAndYourLabel">
          <div id="home" class="itens" title="Home">
            <img
              src="https://img.icons8.com/?size=100&id=86527&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Home</p>
        </div>

        <div class="divAndYourLabel">
          <div id="schedule" class="itens" title="Your Schedules">
            <img
              src="https://img.icons8.com/?size=100&id=116296&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Schedules</p>
        </div>

        <div class="divAndYourLabel">
          <div id="treatments" class="itens" title="Your Treatments">
            <img
              src="https://img.icons8.com/?size=100&id=86312&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Treatments</p>
        </div>

        <div class="divAndYourLabel">
          <div id="plansinapp" class="itenSelected itens" title="Yours Plans in Stores">
            <img
              src="https://img.icons8.com/?size=100&id=86440&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Plans</p>
        </div>

        <div class="divAndYourLabel">
          <div id="projects" class="itens" title="Your Project">
            <img
              src="https://img.icons8.com/?size=100&id=85615&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Projects</p>
        </div>

        

        <div class="divAndYourLabel moreIten">
  <div id="more" class="itens" title="more">
    <img
      src="https://img.icons8.com/?size=100&id=85501&format=png&color=FFFFFF"
      alt=""
    />
  </div>
  <div class="more-content">
    <div class="API">
      <div class="APIimg">
        <img src="https://img.icons8.com/?size=100&id=85950&format=png&color=FFFFFF" alt="">
      </div>
      <div class="APIlabel">API</div>
    </div>
    <div class="API">
      <div class="APIimg">
        <img src="https://img.icons8.com/?size=100&id=86134&format=png&color=FFFFFF" alt="">
      </div>
      <div class="APIlabel">Stores</div>
    </div>
  </div>
</div>
      </aside>
      <main class="infoContent">
        <div id="loading"></div>
        <div class="content " style="flex-wrap: wrap;">
          <div class="plans-content" style="opacity: 1;"></div>
        </div>
      </main>
</body>
<script>
    function createdatas(el) {
      const element = document.createElement("div");
      element.classList.add("planData");
      element.innerHTML = el;
      return element;
    }
    window.addEventListener('load', async () => {
      
        const plans_content = document.querySelector('.plans-content');
        const content = document.querySelector(".content");
        const loading = document.querySelector("#loading")
        const more = document.querySelector(".moreIten")
        more.addEventListener("click", () => {
      console.log(more); // Deve mostrar o elemento
      window.location.href = "/more"
    })
    home.addEventListener("click", () => {
      window.location.href = "/home.html";
    });
    schedule.addEventListener('click', () => {
      console.log('Sensacional d+ serio muito top')
      window.location.href = '/schedule/home';
    })
    const ini = await fetch("/api/me", {
        method: "GET",
        headers: { "Content-Type": "application/json" }
      });
      if (!ini.ok){
        window.location.href = `/Login.html`
      }
      else{
        const data = await ini.json()
        if (data.storeName){
          window.location.href = "/stores/home"
        }
      }
        const req = await fetch("/return/data/plans", {
            method: "GET",
            headers: {"Content-Type": "application/json",}
        })
        if (req.ok){
            const data = await req.json();
            const html = data.html;
            loading.style.opacity = '0';
            
            setTimeout(() => {
                loading.style.display = 'none';
                content.style.display = 'flex';
            }, 500);

            setTimeout(() => {
                content.style.opacity = '1'
                plans_content.appendChild(createdatas(html))
                const btncall = document.querySelector(".central-plus")
                
                const cancel_plan = document.querySelectorAll(".cancel-plan");
                cancel_plan.forEach((el, i) => {
                el.addEventListener("click", async () => {
                    const data_name = el.getAttribute('data-name')
                    const data_store = el.getAttribute("data-store")
                    const req = await fetch("/cancel/plan", {
                        method: 'POST',
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            plan: data_name,
                            store: data_store
                        })
                    })
                    if (req.ok){
                      window.location.reload()
                    }
                    
                })
            })
            btncall.addEventListener("click", () => {
                  window.location.href = '/home.html'
                })
            }, 200)
           
            
                
            
        }   
    })
</script>
</html>
