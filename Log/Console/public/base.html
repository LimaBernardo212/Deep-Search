<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log : Home</title>
    <link rel="stylesheet" href="/style/style.css" />
    <link
      rel="shortcut icon"
      href="/favicons/favicon-32x32.png"
      type="image/x-icon"
    />
  </head>
  <style>
    body {
      background-image: linear-gradient(
        to bottom,
        #0d0d0d,
        #0d0d0d,
        #0d0d0d,
        #042326
      );
    }
  </style>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const body = document.querySelector("body");
      function render(el) {
        const element = document.createElement("div");
        element.classList.add("all");
        element.innerHTML = el;
        return element;
      }
      const url = window.location.pathname;
      try {
        const request = await fetch(`/api${url}`, {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
          },
        });
        if (request.ok) {
          const data = await request.json();
          const html = data.htmlPage;
          const name = data.StoreName;
          const service = data.serviceName;
          console.log(service);
          let simpleArray = [];
          document.title = name;
          console.log(
            data.htmlPage + "|||||||||||||||||||||||||||||" + data.returner
          );

          body.appendChild(render(html));
          const servicesDiv = document.querySelectorAll(".Service");
          const selected = document.querySelector(".selectedIndicator");
          const button = document.querySelector(".selectedIndicator button");
          const services_content = document.querySelector(".services-content");
          const counterOfSelected = document.querySelector(".counter");

          servicesDiv.forEach((el, i) => {
            el.addEventListener("click", () => {
              el.classList.toggle("servicesSelected");
              if (simpleArray.includes(service[i])) {
                let index = simpleArray.indexOf(service[i]);
                if (index != -1) {
                  let removeElements = simpleArray.splice(index, 1);
                  console.log(removeElements[0] + "Suceful");
                }
              } else {
                simpleArray.push(service[i]);
              }

              if (simpleArray.length != 0) {
                counterOfSelected.innerHTML = `Services Selected: ${simpleArray.length}`;
                selected.style.opacity = 1;
              } else {
                selected.style.opacity = 0;
              }
            });
          });
          button.addEventListener("click", async () => {
            try {
              if (simpleArray.length != 0) {
                const req = await fetch("/api/selected", {
                  method: "POST",
                  headers: {
                    "Content-Type": "application/json",
                  },
                  body: JSON.stringify({
                    services: simpleArray,
                    storeName: name,
                  }),
                });
                if (req.ok) {
                  const data = await req.json();
                  const servicesname = data.returner;
                  const arrayServices = data.arrayServices;
                  const arrayFunctionary = data.functionaryArray;
                  const arrayHours = data.hoursArray;
                  const namer = data.name;

                  const jsonData = JSON.stringify(data);
                  console.log(`Deu tudo certo, ${jsonData}`);

                  setTimeout(() => {
                    servicesDiv.forEach((el) => {
                      el.style.opacity = "0";
                      selected.style.opacity = 0;
                      setTimeout(() => {
                        el.style.display = "none";
                        selected.style.display = "none";
                      }, 500);
                    });
                    setTimeout(() => {
                      const isArrayS = Array.isArray(arrayServices);
                      const isArrayF = Array.isArray(arrayFunctionary);
                      const isArrayH = Array.isArray(arrayHours);
                      if (!isArrayS) {
                        services_content.appendChild(render(arrayServices));
                      } else {
                        arrayServices.forEach((el, i) => {
                          services_content.appendChild(
                            render(arrayServices[i])
                          );
                        });
                      }
                      if (!isArrayF) {
                        services_content.appendChild(render(arrayFunctionary));
                      } else {
                        arrayFunctionary.forEach((el, i) => {
                          services_content.appendChild(
                            render(arrayFunctionary[i])
                          );
                        });
                      }
                      if (!isArrayH) {
                        services_content.appendChild(render(arrayHours));
                      } else {
                        arrayHours.forEach((el, i) => {
                          services_content.appendChild(render(arrayHours[i]));
                        })
                      }
                    }, 1000);
                  }, 500);
                }
              }
            } catch (error) {
              console.error(error);
            }
          });
          document.querySelector("#back").addEventListener("click", () => {
            window.history.back();
          });
        }
      } catch (error) {
        console.log("Error");
      }
    });
  </script>
  <body></body>
</html>
