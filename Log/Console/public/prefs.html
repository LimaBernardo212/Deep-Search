<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While Whale - Preferencer</title>
     <link rel="stylesheet" href="/style/style.css" />
     <link
      rel="stylesheet"
      href="/style/mobile.css"
      media="screen and (orientation: portrait)"
    />
    <link
      rel="shortcut icon"
      href="/favicons/favicon-32x32.png"
      type="image/x-icon"
    />
</head>
<body>
    <header class="homenav">
      <div class="consoleImg">
        <img src="/img/().png" alt="" />
      </div>

      <a href="/stores/prefs">
        <div class="account" >
          <div class="person exclude" id="people">
            <img
              src="https://img.icons8.com/?size=100&id=85183&format=png&color=FFFFFF"
              alt=""
            />
          </div>
      </a>
        <a href="/stripeDashBoard">
          <div class="settings" id="sett">
            <img
              src="https://img.icons8.com/?size=100&id=85150&format=png&color=FFFFFF"
              alt=""
            />
          </div>
        </a>
        <a href="/stores/del"  style="margin-left: 1vw;">
        <div class="person" class="burguerButton"><img src="https://img.icons8.com/?size=100&id=105512&format=png&color=FFFFFF" alt=""></div>
      </a>
      </div>
    </header>

    <section class="userPOV">
      <aside class="leftBar">
        <div class="divAndYourLabel">
          <div id="store" class="itens" title="store">
            <img
              src="https://img.icons8.com/?size=100&id=92137&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Home</p>
        </div>
        <div class="divAndYourLabel">
          <div id="analitics" class="itens" title="Your Schedules">
            <img
              src="https://img.icons8.com/?size=100&id=98067&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Analytics</p>
        </div>
        <div class="divAndYourLabel">
          <div id="clientArea" class="itens" title="Your Treatments">
            <img
              src="https://img.icons8.com/?size=100&id=88302&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Schedules</p>
        </div>
        <div class="divAndYourLabel">
          <div id="plansinapp" class="itens" title="Yours Plans in Stores">
            <img
              src="https://img.icons8.com/?size=100&id=86440&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Plans</p>
        </div>
        <div class="divAndYourLabel">
          <div id="services" class="itenSelected itens" title="Your Project">
            <img
              src="https://img.icons8.com/?size=100&id=86844&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Pref.</p>
        </div>
        <div class="divAndYourLabel exclude">
          <div id="delete" class="itens" title="Your Project">
            <img
              src="https://img.icons8.com/?size=100&id=105512&format=png&color=FFFFFF"
              alt=""
            />
          </div>
          <p>Obsolence</p>
        </div>
      </aside>

      <main class="infoContent">
        <div id="loading"></div>

        <div class="content">
          <div class="store-content"></div>
        </div>
      </main>
    </section>
</body>
<script>
    function render(el) {
      const element = document.createElement("div");
      element.classList.add("scheduleData");
      element.innerHTML = el;
      return element;
    }
    function toSetup(el, type, denominacao){
      let url = `/select/updater-wizard/${denominacao}`
      if (type){
        
        
        const updtBtn = document.querySelector(el);
          updtBtn.addEventListener("click", () => {
          window.location.href = url
        })
      }else{
        const updtBtn = document.querySelectorAll(el)
        updtBtn.forEach((el, i) => {
          el.addEventListener("click", () => {
            window.location.href = url
          })
        })
      }
      
    }
    window.addEventListener("load", async () => {
        const load = document.querySelector("#loading");
      const content = document.querySelector(".content");
      const container = document.querySelector(".store-content");
        const plans = document.querySelector("#plansinapp");
      const client = document.querySelector("#store");
      client.addEventListener("click", () => {
        window.location.href = "/stores/home";
      });
      plans.addEventListener("click", () => {
        window.location.href = "/store-plans";
      });
      const analitics = document.querySelector("#analitics");
      analitics.addEventListener("click", () => {
        window.location.href = "/stores/analitics";
      });
      const prefs = document.querySelector("#clientArea")
      prefs.addEventListener("click", () => {
        window.location.href = '/client/schedules'
      })
       const obsoleto = document.querySelector("#delete")
      obsoleto.addEventListener("click", () => {
        window.location.href = '/stores/del'
      })
      const init = await fetch("/api/me", {
        method: "GET",
        headers: { "Content-Type": "application/json" }
      });
      if (!init.ok){
        window.location.href = `/login-redirect?redirect='/stores/home'`
      }
      
      const ini = await fetch("/prefs/render", {
        method: 'GET',
        headers : {
          "Content-Type": "application/json",
        }
      })
      if (ini.ok){
        const data = await ini.json();
        container.appendChild(render(data.returner));
        load.style.opacity = "0";
        content.style.opacity = "1";
      }else{
        window.location.href = '/stores/home'
      }
      toSetup(".miniCalendar", true, 'hour')
      toSetup(".requestBtn", true, 'all')
      toSetup(".temPlan", false, 'plan')
      toSetup(".prefservices", false, 'services')
      toSetup(".functionaryBaseDiv", false, 'team')
      toSetup(".hhmm", false, 'hour')

      const prePayment = document.querySelector(".prePayment")
      let type = prePayment.getAttribute('data-type')
      const preOn = document.querySelector("#prePayOn")
      const preOff = document.querySelector("#prePayOff")
      prePayment.addEventListener("click", async () => {
        if (type == 'false'){
          preOn.style.opacity = '0'
          preOff.style.opacity = '1'
          const req = await fetch("/prePayModify", {
            method: "POST",
            headers: {"Content-Type": "application/json",},
            body: JSON.stringify({
              type: false
            })
          })
          if (req.ok){
            window.location.reload()
          }
        }else{
          preOn.style.opacity = '0'
          preOff.style.opacity = '1'
          const req = await fetch("/prePayModify", {
            method: "POST",
            headers: {"Content-Type": "application/json",},
            body: JSON.stringify({
              type: true
            })
          })
          if (req.ok){
            window.location.reload()
          }
        }
      })
    })
</script>
</html>
