<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While Whale: Pagar pelo App</title>
    <link rel="stylesheet" href="/style/style.css">
    <link
      rel="stylesheet"
      href="/style/mobile.css"
      media="screen and (orientation: portrait)"
    />
    <link rel="shortcut icon" href="/favicons/favicon-32x32.png" type="image/x-icon">
</head>
<body>
    <section class="choice">
        <div class="window">
            <div>
                <h1><strong class="consoleWrite">$</strong>Deseja realizar o <strong class="GreenCard">pagamento?</strong></h1>
                <p><strong class="GreenCard">Pague</strong> pelo aplicativo e otimize seu tempo no dia do seu <strong class="GreenCard">agendamento<strong class="pointer">.</strong></strong></p>
                <div class="windowButtons"><button id="y">Continuar</button> ou <button id="n">Voltar</button></div>
            </div>
        </div>
    </section>
</body>
<script>
    const yes = document.querySelector("#y")
    const no = document.querySelector("#n")
    const pathname = window.location.pathname;
    const id = pathname.split('/').pop()
    no.addEventListener("click", () => {
        window.location.href = "/schedule/home"
    })
    yes.addEventListener("click", async () => {
        const req = await fetch("/pay/schedule", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                id: id
            })
        })
        if (req.ok){
            const data = await req.json()
            console.log(JSON.stringify(data))
            const checkoutUrl = data.checkoutUrl
            window.location.href = checkoutUrl
        }
    })
</script>
</html>
