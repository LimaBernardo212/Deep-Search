<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While Whale - Esqueci minha senha</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="shortcut icon" href="favicons/favicon-32x32.png" type="image/x-icon">
    <link
      rel="stylesheet"
      href="./style/mobile.css"
      media="screen and (orientation: portrait)"
    />
</head>
<body style="background-color: #0d0d0d;">
    <header class="nbu">
        <button class="nButton" id="back">
            <img src="https://img.icons8.com/?size=100&id=99996&format=png&color=FFFFFF" alt="">
        </button>
    </header>
    <div id="forgottonb"></div>
    <section class="newPassword">

        <div class="breakLines">
            <h1>Digite sua nova <strong class="GreenCard">senha</strong><strong class="pointer">|</strong></h1>
            <p><strong class="consoleWrite">&lt;/</strong>Por segurança, reinsira suas informações com a nova senha no campo abaixo. Certifique-se de que seja fácil de lembrar e segura.<strong class="consoleWrite">/></strong></p>
            </div>
            <form action="/update-password" method="post" id="former">
                <input type="text" name="name" id="name" placeholder="Nome" required>
                    <input type="email" name="email" id="email" placeholder="E-mail" required>
                <div class="eye">
                            <input type="password" name="newpassword" id="newpassword" placeholder="Nova Senha" required class="newEmail" enterkeyhint="done">
                            <div class="eyeimg">
                                <img src="https://img.icons8.com/?size=100&id=MiB2bvr7uGVu&format=png&color=FFFFFF" alt="" id="eyeOn">
                                <img src="https://img.icons8.com/?size=100&id=4y6r43dyjbzw&format=png&color=FFFFFF" alt="" id="eyeOff">
                            </div>
                        </div>
                         <button type="submit" class="SubmitButton">Continuar</button>
            </form>
        
    </section>
</body>
<script>
    document.querySelector('#back').addEventListener('click', () => {
            window.history.back();
        });
        const eye = document.querySelector(".eye")
    const onEye = document.querySelector('#eyeOn');
        const offEye = document.querySelector('#eyeOff');
        const password = document.querySelector('#newpassword');
        eye.style.opacity = '1'
        onEye.addEventListener('click', () => {
            offEye.style.display = 'flex'
            onEye.style.opacity = '0';
            setTimeout(() => {
                offEye.style.opacity = '1';
            }, 150)
            password.type = 'text';
        });

        offEye.addEventListener('click', () => {
            offEye.style.opacity = '0';
            onEye.style.opacity = '1';
            setTimeout(() => {
                offEye.style.display = 'none'
            }, 750)
            password.type = 'password';
        });
</script>
</html>
