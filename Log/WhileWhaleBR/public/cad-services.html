<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>While Whale - Cadastro de Serviços</title>
    <link rel="stylesheet" href="/style/style.css" />
    <link
      rel="stylesheet"
      href="/style/mobile.css"
      media="screen and (orientation: portrait)"
    />
    <link
      rel="shortcut icon"
      href="/favicons/favicon-32x32.png"
      type="image/x-icon"
    />
  </head>
  <body style="background-image: linear-gradient(to bottom, #042326, #0d0d0d);">
    <header class="nbu">
      <!-- <button class="nButton" id="back">
        <img
          src="https://img.icons8.com/?size=100&id=99996&format=png&color=FFFFFF"
          alt=""
        />
      </button> -->
    </header>

    <section class="services-container">
      <div class="services-outer">
        <div class="services-tesxt">
          <h1 id="ob">
            <strong class="consoleWrite">>></strong>
            Cadastro de Serviços
            <strong class="pointer">.</strong>
          </h1>
          <p>
            <strong class="consoleWrite">>_</strong>
            Cadastre os <strong class="GreenCard">serviços</strong> da sua loja
          </p>
        </div>

        <form
          action="/servicesCad"
          class="servicesForm"
          method="post"
          enctype="multipart/form-data"
        >
          <div class="ServiceInput">
            <div class="imageServiceInput">
              <img
                src="https://img.icons8.com/?size=100&id=95779&format=png&color=FFFFFF"
                alt=""
              />
              <input type="file" name="image" id="image" />
            </div>
            <div class="servicesInfos">
              <input
                type="text"
                name="serviceName"
                id="serviceName"
                placeholder="Nome do serviço:"
              />
              <textarea
                name="serviceDesc"
                id="serviceDesc"
                placeholder="Escreva uma descrição para o seu serviço (máximo 100 caracteres)"
                maxlength="100"
              ></textarea>
              <span class="Caracters">Caracteres: <strong class="GreenCard">0</strong> / <strong class="GreenCard">100</strong></span>

              <select name="servicesTime" id="servicesTime">
                <option value="00:00">Escolha a duração do serviço</option>
                <option value="00:10">10 min</option>
                <option value="00:15">15 min</option>
                <option value="00:30">30 min</option>
                <option value="00:45">45 min</option>
                <option value="01:00">1 hora</option>
                <option value="01:30">1h30</option>
                <option value="02:00">2 horas</option>
                <option value="02:30">2h30</option>
                <option value="03:00">3 horas</option>
                <option value="03:30">3h30</option>
                <option value="04:00">4 horas</option>
                <option value="04:30">4h30</option>
                <option value="05:00">5 horas</option>
              </select>
           
              <h2 style="display: flex; align-items: center;">
                <img
                  src="https://img.icons8.com/?size=100&id=123084&format=png&color=FFFFFF"
                  alt=""
                />
                <input type="text" name="servicePrice" id="servicePrice" placeholder="Preço (R$)" />
              </h2>
            </div>
          </div>
        </form>

        <div class="wid">
          <div class="central-plus especialPortrait" id="adderer">
            <div class="label-plus">
              <p>Adicionar novo <strong class="GreenCard">serviço</strong></p>
            </div>
            <div class="img-plus">
              <img
                src="https://img.icons8.com/?size=100&id=95779&format=png&color=FFFFFF"
              />
            </div>
          </div>
        </div>
      </div>

      <div class="selectedIndicatorC" style="opacity: 1">
        <button type="submit">
          Cadastrar Serviços<strong class="consoleWrite">>></strong>
        </button>
      </div>
    </section>

    <script>
      function createService() {
        const service = document.createElement("div");
        service.classList.add("ServiceDiv");
        service.innerHTML = `<div class="ServiceInput">
            <div class="imageServiceInput">
              <img
                src="https://img.icons8.com/?size=100&id=95779&format=png&color=FFFFFF"
                alt=""
              />
              <input type="file" name="image" id="image" />
            </div>

            <div class="servicesInfos">
              <input
                type="text"
                name="serviceName"
                id="serviceName"
                placeholder="Nome do serviço:"
              />

              <textarea
                name="serviceDesc"
                id="serviceDesc"
                placeholder="Escreva uma descrição para o seu serviço (máximo 100 caracteres)"
                maxlength="100"
              ></textarea>

              <span class="Caracters">
                Caracteres:
                <strong class="GreenCard">0</strong>
                /
                <strong class="GreenCard">100</strong>
              </span>

              <select name="servicesTime" id="servicesTime">
                <option value="00:00">Escolha a duração do serviço</option>
                <option value="00:10">10 min</option>
                <option value="00:15">15 min</option>
                <option value="00:30">30 min</option>
                <option value="00:45">45 min</option>
                <option value="01:00">1 hora</option>
                <option value="01:30">1h30</option>
                <option value="02:00">2 horas</option>
                <option value="02:30">2h30</option>
                <option value="03:00">3 horas</option>
                <option value="03:30">3h30</option>
                <option value="04:00">4 horas</option>
                <option value="04:30">4h30</option>
                <option value="05:00">5 horas</option>
              </select>

              <h2 style="display: flex; align-items: center;">
                <img src="https://img.icons8.com/?size=100&id=123084&format=png&color=FFFFFF" alt="">
                <input type="text" name="servicePrice" id="servicePrice" placeholder="Preço (R$)" />
              </h2>
            </div>
          </div>`;

        const newTextarea = service.querySelector("textarea");
        const newSpan = service.querySelector(".Caracters");

        newTextarea.addEventListener("input", () => {
          let n = newTextarea.value.length;
          newSpan.innerHTML = `Caracteres: <strong class="GreenCard">${n}</strong> / <strong class="GreenCard">100</strong>`;
        });

        setupListeners(service);
        return service;
      }

      function setupListeners(el) {
        const serviceInput = document.querySelectorAll(".ServiceInput");
        const fileContent = el.querySelector(`#image`);
        const fileInput = el.querySelector("#image");
        let selectedFile = null;

        el.addEventListener("dragover", (e) => {
          e.preventDefault();
          e.stopPropagation();
        });

        el.addEventListener("drop", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const files = e.dataTransfer.files;
          if (files.length > 0) {
            handleFiles(files[0]);
          }
        });

        fileInput.addEventListener("change", (e) => {
          if (e.target.files.length > 0) {
            handleFiles(e.target.files[0]);
          }
        });

        function handleDrop(e) {
          const dt = e.dataTransfer;
          const files = dt.files;
          if (files.length > 0) {
            handleFiles(files[0]);
          }
        }

        function handleFiles(files) {
          selectedFile = files;
          console.log(selectedFile);
          const reader = new FileReader();
          const serviceInput = el.querySelector(".imageServiceInput");
          serviceInput.style.transition = "0.001s all";

          reader.onload = (e) => {
            serviceInput.style.border = "1px solid transparent";
            serviceInput.style.backgroundColor = "transparent";
            serviceInput.innerHTML = `
            <div class="imageServiceAtt">
              <img
                src="${e.target.result}"
                alt=""
                accept="image/*"
              />
              <input type="file" name="image" id="image" />
            </div>`;

            const serviceInput_img = el.querySelector(".imageServiceInput img");
            const newInput = el.querySelector("#image");
            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(selectedFile);
            newInput.files = dataTransfer.files;
          };
          reader.readAsDataURL(files);
        }
      }

      const serviceInput = document.querySelector(".ServiceInput");
      setupListeners(serviceInput);

      const container = document.querySelector(".servicesForm");
      const adder = document.querySelector("#adderer");

      adder.addEventListener("click", () => {
        container.appendChild(createService());
      });

      const txtArea = document.querySelector("textarea");
      const span = document.querySelector(".Caracters");

      txtArea.addEventListener("input", () => {
        let n = txtArea.value.length;
        span.innerHTML = `Caracteres: <strong class="GreenCard">${n}</strong> / <strong class="GreenCard">100</strong>`;
      });

      const form = document.querySelector(".servicesForm");
      const selectedIndicatorA = document.querySelector(".selectedIndicatorC");

      selectedIndicatorA.addEventListener("click", () => {
        form.submit();
      });
    </script>
  </body>
</html>
